<!DOCTYPE html>
<html>

<head>
    
<style>
/* =================================
   STUMPS CRICKET SIMULATOR
   Dark Stadium + Emerald Theme
   ================================= */

@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');

:root {
    --bg: #080e0b;
    --panel: #111c15;
    --panel-light: #18271d;
    --green: #24d17b;
    --green-light: #a3ffc9;
    --white: #f4f8f5;
    --muted: #a4b5a9;
    --border: #294332;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 32px 6%;
    min-height: 100vh;
    color: var(--white);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    line-height: 1.6;
    background:
        radial-gradient(ellipse at 50% 0%, #16442b 0%, transparent 42%),
        radial-gradient(ellipse at 100% 50%, #10251a 0%, transparent 45%),
        var(--bg);
}

/* Main title */

h1 {
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 1px;
    margin: 10px 0 8px;
    color: var(--white);
    text-shadow: 0 0 30px #24d17b35;
}

h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1.7rem, 3vw, 2.5rem);
    color: var(--green-light);
    margin-top: 18px;
    margin-bottom: 14px;
}

h3 {
    color: var(--white);
    font-size: 1.1rem;
}

p, label {
    color: var(--muted);
}

/* Big Surprise teaser */

#bigSurprise {
    width: fit-content;
    max-width: 100%;
    margin: 12px auto 30px;
    padding: 12px 24px;
    text-align: center;
    color: var(--green-light);
    font-weight: 800;
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    letter-spacing: 2px;
    background: linear-gradient(135deg, #153d27, #102319);
    border: 1px solid var(--green);
    border-radius: 12px;
    box-shadow: 0 0 25px #24d17b20;
}

/* Buttons */

button {
    margin: 5px 4px 5px 0;
    padding: 12px 19px;
    border: 1px solid var(--green);
    border-radius: 10px;
    background: linear-gradient(135deg, #28d982, #159653);
    color: #06130b;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease,
                box-shadow 0.18s ease,
                filter 0.18s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 22px #24d17b35;
    filter: brightness(1.12);
}

button:active {
    transform: translateY(0);
}

/* Dropdowns and form controls */

select, input, textarea {
    max-width: 100%;
    padding: 11px 13px;
    margin: 5px 5px 8px 0;
    color: var(--white);
    background: #0b140e;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
}

select:focus, input:focus, textarea:focus {
    outline: 2px solid var(--green);
    outline-offset: 2px;
}

/* Main content panels */

#teamSelection,
#tournamentSetup,
#matchSetup,
#matchArea {
    margin: 22px 0;
    padding: 24px;
    background: linear-gradient(145deg, #142119f5, #0e1711f5);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 12px 35px #00000030;
}

/* Scoreboard */

#scoreboard {
    margin: 18px 0;
    padding: 22px;
    background: linear-gradient(135deg, #102b1c, #0b1710);
    border: 1px solid #277d4b;
    border-radius: 14px;
    color: var(--white);
    overflow-wrap: anywhere;
}

/* Dividers */

hr {
    height: 1px;
    margin: 28px 0;
    border: none;
    background: linear-gradient(
        90deg,
        transparent,
        #31563d,
        transparent
    );
}

/* Keep content readable on smaller screens */

@media (max-width: 600px) {
    body {
        padding: 20px 5%;
    }

    #teamSelection,
    #tournamentSetup,
    #matchSetup,
    #matchArea {
        padding: 16px;
        border-radius: 13px;
    }

    button {
        padding: 11px 14px;
        max-width: 100%;
    }

    #bigSurprise {
        padding: 10px 14px;
        letter-spacing: 1px;
    }
}
</style>
<title>Stumps Cricket Simulator</title>
</head>

<body onload="createTeamNameInputs()">

<h1>🏏 Stumps Cricket Simulator</h1>
<p id="bigSurprise">
    👀 BIG SURPRISE COMING SOON...
</p>

<!-- LOAD DATABASE + FUNCTIONS FIRST -->
<script src="players.js"></script>
<script src="teamGenerator.js"></script>


<!-- RANDOM PLAYER TEST -->

<button onclick="showPlayer()">Random Player</button>

<p id="result"></p>


<script>

function showPlayer(){

let player = players[Math.floor(Math.random()*players.length)];

document.getElementById("result").innerHTML =
"Name: " + player.name +
"<br>Role: " + player.role +
"<br>Batting: " + player.bat + "%" +
"<br>Bowling: " + player.bowl + "%" +
"<br>Stamina: " + player.stamina + "%";

}

</script>



<hr>


<!-- TEAM GENERATOR -->

<!-- TEAM SELECTION -->

<h2>🏏 1vs1</h2>
    
<button onclick="startTeamSelection()">
🏏 Choose Players
</button>

<div id="teamSelection" style="display:none;">

    <h3>TEAM A</h3>

    <select id="playerSelectA">
        <option value="">Select a player</option>
    </select>

    <button onclick="addPlayerToTeam('A')">
        ➕ Add to Team A
    </button>

    <div id="teamAList"></div>

    <hr>

    <h3>TEAM B</h3>

    <select id="playerSelectB">
        <option value="">Select a player</option>
    </select>

    <button onclick="addPlayerToTeam('B')">
        ➕ Add to Team B
    </button>

    <div id="teamBList"></div>
<br>

<button onclick="confirmTeams()">
✅ Confirm Teams
</button>

<div id="teamConfirmMessage"></div>
</div>



<hr>

<!-- ===============================
     TOURNAMENT MODE
================================ -->

<div id="tournamentSetup">

    <h2>🏆 STUMPS TOURNAMENT MODE</h2>

    <label>
        Number of Teams:
    </label>

    <select id="tournamentTeamCount"
            onchange="createTeamNameInputs()">

        <option value="4">4 Teams</option>
        <option value="5">5 Teams</option>
        <option value="6">6 Teams</option>
        <option value="7">7 Teams</option>
        <option value="8">8 Teams</option>

    </select>


    <br><br>


    <div id="teamNameInputs"></div>


    <br>


    <button onclick="createTournament()">
        🏆 Create Tournament
    </button>


    <div id="tournamentMessage"></div>
   <div id="tournamentTeamsArea"></div>

<hr>

<div id="pointsTableArea"></div>

<hr>

<div id="fixtureArea"></div>

<hr>

<!-- ===============================
     TRI-SERIES MODE
================================ -->

<div id="triSeriesSetup">

    <h2> <b>3️⃣ TRI-SERIES MODE (coming soon!) </h2>

    <p>
        3 teams • 20 overs • 7 matches
    </p>

    <button onclick="createTriSeries()">
        3️⃣ TRI-Series mode (under maintenance, coming soon!)
    </button>

    <div id="triSeriesMessage"></div>

    <div id="triSeriesTeamsArea"></div>

    <div id="triSeriesTableArea"></div>

    <div id="triSeriesFixtureArea"></div>

</div>

</div>

<!-- TOSS AREA -->

<div id="matchSetup" style="display:none;">

<h2>🏏 Match Setup</h2>


<p>
<b>Who won the toss?</b>
</p>


<button onclick="tossWinner('A')">
Team A
</button>


<button onclick="tossWinner('B')">
Team B
</button>


<button onclick="randomToss()">
🎲 Random Toss
</button>



<br><br>


<div id="batBowlChoice"></div>


</div>



<hr>



<!-- LIVE MATCH -->

<div id="matchArea" style="display:none;">

<h2>🏏 LIVE MATCH</h2>


<div id="scoreboard">

</div>


<button onclick="nextBall()">
🏏 Next Ball
</button>
<button onclick="autoPlayMatch()">
    ⚡ AUTO PLAY MATCH
</button>

</div>



</body>

</html>
