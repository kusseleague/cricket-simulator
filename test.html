<!DOCTYPE html>
<html>

<head>
<title>Player Database Test</title>
</head>

<body>

<h1>🏏 Cricket Player Database</h1>

<button onclick="showPlayer()">Random Player</button>

<p id="result"></p>


<script src="players.js"></script>


<script>

function showPlayer(){

let player = players[Math.floor(Math.random()*players.length)];

document.getElementById("result").innerHTML =
"Name: " + player.name +
"<br>Role: " + player.role +
"<br>Batting: " + player.bat + "%" +
"<br>Bowling: " + player.bowl + "%" +
"<br>Stamina: " + player.stamina + "%";

}

</script>


</body>

</html>
