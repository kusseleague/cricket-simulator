<!DOCTYPE html>
<html>

<head>
    
<style>
/* =================================
   STUMPS CRICKET SIMULATOR
   Dark Stadium + Emerald Theme
   ================================ */

@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');


:root {
    --bg: #080e0b;
    --panel: #111713;
    --panel-light: #18211b;

    --green: #24d17b;
    --green-light: #a3ffc9;
    --border: #294332;

    --accent: #24d17b;
    --accent-dark: #159653;
    --accent-glow: #24d17b35;
    --glow: #16442b;
    --glow-secondary: #10251a;

    --white: #f4f8f5;
    --muted: #a4b5a9;

}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 32px 6%;
    min-height: 100vh;
    color: var(--white);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    line-height: 1.6;
   
background-color: var(--bg);
background-image:
    linear-gradient(
        to right,
        #080e0b 0%,
        rgba(8, 14, 11, 0.95) 30%,
        rgba(8, 14, 11, 0.65) 55%,
        rgba(8, 14, 11, 0.15) 100%
    ),
    var(--stadium-image, none),
    radial-gradient(ellipse at 50% 0%, var(--glow) 0%, transparent 42%),
    radial-gradient(ellipse at 100% 50%, var(--glow-secondary) 0%, transparent 45%);

background-size:
    100% 100%,
    auto 100vh,
    auto,
    auto;

background-position:
    center,
    right center,
    center top,
    right center;

background-repeat: no-repeat;

}

/* Stadium image layer */
body {
    position: relative;
    isolation: isolate;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;

    background-image:
        linear-gradient(
            to right,
            #080e0b 0%,
            rgba(8, 14, 11, 0.94) 30%,
            rgba(8, 14, 11, 0.55) 60%,
            rgba(8, 14, 11, 0.18) 100%
        ),
        var(--stadium-image, none);

    background-size: 100% 100%, cover;
    background-position: center, right center;
    background-repeat: no-repeat;
    opacity: 0.85;
}

/* Main title */

h1 {
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 800;
    letter-spacing: 1px;
    margin: 10px 0 8px;
    color: var(--white);
    text-shadow: 0 0 30px #24d17b35;
}

h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(1.7rem, 3vw, 2.5rem);
    color: var(--green-light);
    margin-top: 18px;
    margin-bottom: 14px;
}

h3 {
    color: var(--white);
    font-size: 1.1rem;
}

p, label {
    color: var(--muted);
}

/* Big Surprise teaser */

#bigSurprise {
    width: fit-content;
    max-width: 100%;
    margin: 12px auto 30px;
    padding: 12px 24px;
    text-align: center;
    color: var(--green-light);
    font-weight: 800;
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    letter-spacing: 2px;
    background: linear-gradient(135deg, #153d27, #102319);
    border: 1px solid var(--green);
    border-radius: 12px;
    box-shadow: 0 0 25px #24d17b20;
}

/* Buttons */

button {
    margin: 5px 4px 5px 0;
    padding: 12px 19px;
    border: 1px solid var(--green);
    border-radius: 10px;
    background: linear-gradient(135deg, #28d982, #159653);
    color: #06130b;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease,
                box-shadow 0.18s ease,
                filter 0.18s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 7px 22px #24d17b35;
    filter: brightness(1.12);
}

button:active {
    transform: translateY(0);
}

/* Dropdowns and form controls */

select, input, textarea {
    max-width: 100%;
    padding: 11px 13px;
    margin: 5px 5px 8px 0;
    color: var(--white);
    background: #0b140e;
    border: 1px solid var(--border);
    border-radius: 8px;
    font: inherit;
}

select:focus, input:focus, textarea:focus {
    outline: 2px solid var(--green);
    outline-offset: 2px;
}

/* Main content panels */

#teamSelection,
#tournamentSetup,
#matchSetup,
#matchArea {
    margin: 22px 0;
    padding: 24px;
    background: linear-gradient(145deg, #142119f5, #0e1711f5);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 12px 35px #00000030;
}


/* Scoreboard */

#scoreboard {
    margin: 18px auto;
    padding: 28px 22px;
    max-width: 850px;
    text-align: center;
    font-size: 1.2rem;
    line-height: 1.9;
   
background: linear-gradient(
    135deg,
    rgba(24, 33, 27, 0.40),
    rgba(8, 14, 11, 0.40)
);

    border: 1px solid #277d4b;
    border-radius: 14px;
    color: var(--white);
    overflow-wrap: anywhere;
}

#scoreboard strong,
#scoreboard b {
    font-size: 1.15em;
}

/* Dividers */

hr {
    height: 1px;
    margin: 28px 0;
    border: none;
    background: linear-gradient(
        90deg,
        transparent,
        #31563d,
        transparent
    );
}

/* Keep content readable on smaller screens */

@media (max-width: 600px) {
    body {
        padding: 20px 5%;
    }

    #teamSelection,
    #tournamentSetup,
    #matchSetup,
    #matchArea {
        padding: 16px;
        border-radius: 13px;
    }

    button {
        padding: 11px 14px;
        max-width: 100%;
    }

    #bigSurprise {
        padding: 10px 14px;
        letter-spacing: 1px;
    }
}    
/* =================================
   STUMPS FUTURISTIC HUD OVERLAY
   Venue-aware animated analytics
   ================================= */

#stumpsHud {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    opacity: 0.72;
    contain: strict;
}

#stumpsHud canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* Keep every existing interface element above the HUD */
body > *:not(#stumpsHud) {
    position: relative;
    z-index: 1;
}

/* Keep the HUD subtle on smaller screens */
@media (max-width: 600px) {
    #stumpsHud {
        opacity: 0.75;
    }
}

/* Respect accessibility settings */
@media (prefers-reduced-motion: reduce) {
    #stumpsHud {
        opacity: 0.90;
    }

}
</style>

<script>
(function () {
    const music = document.getElementById("stumpsMusic");
    const toggle = document.getElementById("musicToggle");

    if (!music || !toggle) return;

    music.volume = 0.10;

    function updateButton() {
        toggle.textContent = music.paused || music.muted
            ? "🔇 MUSIC OFF"
            : "🔊 MUSIC ON";

        toggle.setAttribute(
            "aria-label",
            music.paused || music.muted
                ? "Play background music"
                : "Mute background music"
        );
    }

    toggle.addEventListener("click", function () {
        if (music.paused || music.muted) {
            music.muted = false;
            music.play().then(updateButton).catch(updateButton);
        } else {
            music.muted = true;
            updateButton();
        }
    });

    // Attempt autoplay when Stumps opens.
    music.play().then(updateButton).catch(function () {
        updateButton();
    });
})();
</script>

    
<!-- STUMPS FUTURISTIC ANALYTICS HUD -->
<div id="stumpsHud" aria-hidden="true">
    <canvas id="stumpsHudCanvas"></canvas>
</div>

<script>
(function () {
    const canvas = document.getElementById("stumpsHudCanvas");
    const ctx = canvas.getContext("2d");

    if (!canvas || !ctx) return;

    let width = 0;
    let height = 0;
    let animationId = null;
    let lastFrame = 0;
    let time = 0;

    const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    );

    const nodes = [];
    const dataPoints = [];

    function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        nodes.length = 0;
        dataPoints.length = 0;

        // HUD nodes stay around the outer edges.
        for (let i = 0; i < 26; i++) {
            const side = i % 2 === 0 ? "left" : "right";

            nodes.push({
                x: side === "left"
                    ? Math.random() * width * 0.22
                    : width * 0.78 + Math.random() * width * 0.22,
                y: Math.random() * height,
                phase: Math.random() * Math.PI * 2
            });
        }

        for (let i = 0; i < 12; i++) {
            dataPoints.push({
                value: 0.2 + Math.random() * 0.8,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    function getAccent() {
        return getComputedStyle(document.documentElement)
            .getPropertyValue("--accent")
            .trim() || "#24d17b";
    }

    function drawGrid(accent) {
        ctx.save();
        ctx.strokeStyle = accent;
        ctx.globalAlpha = 0.075;
        ctx.lineWidth = 0.6;

        const spacing = 42;

        for (let x = 0; x < width; x += spacing) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
        }

        for (let y = 0; y < height; y += spacing) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawRadar(x, y, radius, accent, phase) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1;

        // Circular scanning rings
        for (let i = 1; i <= 4; i++) {
            ctx.globalAlpha = 0.11 - i * 0.015;
            ctx.beginPath();
            ctx.arc(0, 0, radius * i / 4, 0, Math.PI * 2);
            ctx.stroke();
        }

        // Radar crosshairs
        ctx.globalAlpha = 0.12;
        ctx.beginPath();
        ctx.moveTo(-radius, 0);
        ctx.lineTo(radius, 0);
        ctx.moveTo(0, -radius);
        ctx.lineTo(0, radius);
        ctx.stroke();

        // Rotating scan beam
        const angle = phase % (Math.PI * 2);

        ctx.globalAlpha = 0.22;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, angle - 0.35, angle);
        ctx.closePath();
        ctx.fillStyle = accent;
        ctx.fill();

        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(
            Math.cos(angle) * radius,
            Math.sin(angle) * radius
        );
        ctx.stroke();

        // Radar contact
        const px = Math.cos(angle * 1.7) * radius * 0.62;
        const py = Math.sin(angle * 1.7) * radius * 0.62;

        ctx.globalAlpha = 0.8;
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(px, py, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawConnections(accent) {
        ctx.save();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 0.8;

        nodes.forEach((node, i) => {
            const pulse = 0.12 + (
                Math.sin(time * 0.001 + node.phase) + 1
            ) * 0.09;

            ctx.globalAlpha = pulse;

            // Connect nearby nodes on the same side.
            for (let j = i + 1; j < nodes.length; j++) {
                const other = nodes[j];

                if ((node.x < width / 2) !==
                    (other.x < width / 2)) continue;

                const dx = node.x - other.x;
                const dy = node.y - other.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 145) {
                    ctx.beginPath();
                    ctx.moveTo(node.x, node.y);
                    ctx.lineTo(other.x, other.y);
                    ctx.stroke();
                }
            }

            ctx.globalAlpha = pulse + 0.1;
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.arc(node.x, node.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.restore();
    }

    function drawTacticalLines(accent) {
        ctx.save();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1;

        // Short, angled tactical traces in the side margins.
        for (let side = 0; side < 2; side++) {
            const baseX = side === 0 ? 22 : width - 22;
            const direction = side === 0 ? 1 : -1;

            for (let i = 0; i < 4; i++) {
                const y = height * (0.25 + i * 0.15);
                const length = 18 + (
                    Math.sin(time * 0.001 + i) + 1
                ) * 14;

                ctx.globalAlpha = 0.18;
                ctx.beginPath();
                ctx.moveTo(baseX, y);
                ctx.lineTo(baseX + direction * length, y - 12);
                ctx.lineTo(baseX + direction * length * 1.7, y - 12);
                ctx.stroke();

                ctx.globalAlpha = 0.55;
                ctx.beginPath();
                ctx.arc(
                    baseX + direction * length * 1.7,
                    y - 12,
                    2,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
            }
        }

        ctx.restore();
    }

    function drawDataBars(accent) {
        ctx.save();

        const barWidth = 4;
        const gap = 4;
        const totalWidth = dataPoints.length * (barWidth + gap);

        // Small analytics display in the bottom corner.
        const xStart = width - totalWidth - 26;
        const yBase = height - 35;

        dataPoints.forEach((point, i) => {
            const animated = (
                Math.sin(time * 0.0012 + point.phase) + 1
            ) / 2;

            const barHeight = 5 + animated * 23;
            const x = xStart + i * (barWidth + gap);

            ctx.globalAlpha = 0.35 + animated * 0.35;
            ctx.fillStyle = accent;
            ctx.fillRect(x, yBase - barHeight, barWidth, barHeight);
        });

        // Tiny HUD label
        ctx.globalAlpha = 0.48;
        ctx.fillStyle = accent;
        ctx.font = "9px monospace";
        ctx.textAlign = "right";
        ctx.fillText("LIVE DATA", width - 26, height - 14);

        ctx.restore();
    }

    function drawCornerMarks(accent) {
        ctx.save();
        ctx.strokeStyle = accent;
        ctx.lineWidth = 1;

        const size = 17;
        const inset = 16;

        const corners = [
            [inset, inset, 1, 1],
            [width - inset, inset, -1, 1],
            [inset, height - inset, 1, -1],
            [width - inset, height - inset, -1, -1]
        ];

        corners.forEach(([x, y, dx, dy]) => {
            ctx.globalAlpha = 0.48;
            ctx.beginPath();
            ctx.moveTo(x + dx * size, y);
            ctx.lineTo(x, y);
            ctx.lineTo(x, y + dy * size);
            ctx.stroke();
        });

        ctx.restore();
    }

    function render(timestamp) {
        if (document.hidden) {
            animationId = null;
            return;
        }

        // Limit animation to about 30 FPS.
        if (timestamp - lastFrame < 33) {
            animationId = requestAnimationFrame(render);
            return;
        }

        lastFrame = timestamp;
        time = reducedMotion.matches ? 0 : timestamp;

        ctx.clearRect(0, 0, width, height);

        const accent = getAccent();

        drawGrid(accent);

        drawRadar(
            width * 0.12,
            height * 0.35,
            Math.min(95, width * 0.12),
            accent,
            time * 0.00025
        );

        drawRadar(
            width * 0.88,
            height * 0.68,
            Math.min(78, width * 0.10),
            accent,
            -time * 0.0002
        );

        drawConnections(accent);
        drawTacticalLines(accent);
        drawDataBars(accent);
        drawCornerMarks(accent);

        if (!reducedMotion.matches) {
            animationId = requestAnimationFrame(render);
        }
    }

    function startAnimation() {
        if (animationId !== null) return;
        animationId = requestAnimationFrame(render);
    }

    function stopAnimation() {
        if (animationId !== null) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
    }

    document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
            stopAnimation();
        } else {
            startAnimation();
        }
    });

    reducedMotion.addEventListener?.("change", function () {
        stopAnimation();
        startAnimation();
    });

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    startAnimation();
})();
</script>


</body>

</html>
